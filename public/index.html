<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 2rem 1rem; }
    main { max-width: 480px; margin: 0 auto; background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { margin-top: 0; }
    form { display: flex; gap: .5rem; }
    input[type=text] { flex: 1; padding: .6rem; font-size: 1rem; border: 1px solid #d1d5db; border-radius: 6px; }
    button { padding: .6rem 1rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; font-size: 1rem; }
    ul { list-style: none; padding: 0; margin: 1rem 0 0; }
    li { display: flex; align-items: center; gap: .6rem; padding: .6rem 0; border-bottom: 1px solid #e5e7eb; }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: #9ca3af; }
    li button { background: transparent; color: #dc2626; padding: .2rem .5rem; }
    .empty { color: #9ca3af; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>To-Do List</h1>
    <form id="form">
      <input type="text" id="text" placeholder="What needs doing?" autocomplete="off" required>
      <button>Add</button>
    </form>
    <ul id="list"></ul>
  </main>
  <script>
    const list = document.getElementById('list');
    const api = (path, opts) => fetch('/api/todos' + path, {
      headers: { 'Content-Type': 'application/json' }, ...opts
    });

    async function load() {
      const todos = await (await api('')).json();
      list.innerHTML = '';
      if (!todos.length) list.innerHTML = '<li class="empty">Nothing to do!</li>';
      for (const t of todos) {
        const li = document.createElement('li');
        li.className = t.done ? 'done' : '';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = t.done;
        cb.onchange = async () => { await api('/' + t.id, { method: 'PATCH', body: JSON.stringify({ done: cb.checked }) }); load(); };
        const span = document.createElement('span');
        span.textContent = t.text;
        const del = document.createElement('button');
        del.textContent = '✕';
        del.onclick = async () => { await api('/' + t.id, { method: 'DELETE' }); load(); };
        li.append(cb, span, del);
        list.append(li);
      }
    }

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('text');
      await api('', { method: 'POST', body: JSON.stringify({ text: input.value }) });
      input.value = '';
      load();
    };
    load();
  </script>
</body>
</html>
